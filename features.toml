# The closed vocabulary from `spec/10-feature-demand.md` section 10.2.
# Every `demands` entry in every manifest draws from this file and the lint rejects anything else.
# The `diagnostic` lists are what turn a failed build into a feature name without anybody reading
# a log, so an entry with an empty list is an entry nothing can classify yet, and filling it in is
# a change worth making the first time rucc prints something for it.

[always-inline]
summary = "__attribute__((always_inline)) honoured rather than treated as a hint"
kind = "gnu-extension"
rucc-issue = "https://github.com/tamnd/rucc/issues/542"
standard = "GNU extension with no portable spelling"

# There is no diagnostic list here and there cannot be one, which is the whole point of the entry.
# rucc parses the attribute, accepts it without a word at any warning level, and then does not run
# the handler, so a program that uses it compiles, links, exits zero and behaves differently than
# the same program built by gcc. Every other entry in this file that names a missing feature can be
# found by reading a failed build's output. This one can only be found by running the program and
# noticing the answer is wrong, which is how it was found: libjansson's api suite checks that a
# refcount came back down at the closing brace and it had not.
[cleanup-attribute]
summary = "__attribute__((cleanup(f))) runs f at every exit from the enclosing block, in reverse declaration order"
kind = "gnu-extension"
rucc-issue = "https://github.com/tamnd/rucc/issues/786"
standard = "GNU extension with no portable spelling"

[atomic-builtins]
summary = "__atomic_load_n and __atomic_store_n at relaxed ordering"
kind = "gnu-builtin"
diagnostic = ["E0686"]
rucc-issue = "https://github.com/tamnd/rucc/issues/311"
standard = "GNU extension; C11 <stdatomic.h> is the portable spelling"

[autoconf-probes]
summary = "the compiler answers a generated configure script the way autoconf expects"
kind = "driver"

[bit-builtins]
summary = "__builtin_clz, __builtin_ctz, __builtin_popcount and their l and ll forms"
kind = "gnu-builtin"
diagnostic = ["E0686"]
rucc-issue = "https://github.com/tamnd/rucc/issues/310"
standard = "GNU extension; C23 <stdbit.h> is the portable spelling"

[bit-manipulation]
summary = "shifts, masks and bit level packing across byte boundaries"
kind = "standard"

[char-signedness]
summary = "-funsigned-char and -fsigned-char, which decide the sign of a plain char and so change the ABI"
kind = "abi"
diagnostic = ["unknown option `-funsigned-char`", "unknown option `-fsigned-char`"]
rucc-issue = "https://github.com/tamnd/rucc/issues/489"
standard = "the standard leaves the sign of plain char to the implementation; on x86-64 it is signed and the flag is how a program says otherwise"

[cmake-probes]
summary = "the compiler answers cmake's compiler identification and abi detection the way cmake expects"
kind = "driver"

[computed-goto]
summary = "labels as values, goto *"
kind = "gnu-extension"
diagnostic = ["no rule lowers a block_addr"]
rucc-issue = "https://github.com/tamnd/rucc/issues/353"
standard = "GNU extension with no portable spelling"

[constant-time]
summary = "arithmetic written to take the same time whatever the secret is, which the optimizer must not turn back into a branch"
kind = "standard"

[deep-macros]
summary = "macros expanding through several layers, including __VA_ARGS__ forwarding"
kind = "preprocessor"

[double-formatting]
summary = "printf and strtod round tripping a double without losing a digit"
kind = "standard"

[driver-print-dirs]
summary = "-print-search-dirs, -print-libgcc-file-name and the rest of what a build system asks the driver"
kind = "driver"

[driver-stdin-input]
summary = "-x names the language of the inputs that follow, and a file named - is standard input"
kind = "driver"
diagnostic = ["unknown option `-xc`", "cannot find -"]
rucc-issue = "https://github.com/tamnd/rucc/issues/812"
standard = "not in the standard; it is how a build system asks a question without writing a file"

[feature-test-macros]
summary = "_GNU_SOURCE and the __STDC_WANT_ family, set by the program before it includes anything, and undefined first"
kind = "preprocessor"
diagnostic = ["cannot be undefined"]
rucc-issue = "https://github.com/tamnd/rucc/issues/757"
standard = "POSIX and C23 Annex K name the macros; an #undef of one that is not currently defined has no effect, per 6.10.4"

[flexible-array-member]
summary = "a struct ending in an incomplete array, allocated with the header in front of it"
kind = "standard"

[float-arithmetic]
summary = "float and double arithmetic in volume, without contraction changing the answer"
kind = "standard"

# The three diagnostics are three halves of the same header, which is why they are one entry. The
# narrow string headers need the `_chk` family, the wide ones need the va_arg_pack pair, and both
# call __builtin_object_size to work out what to check against. Nobody passes -D_FORTIFY_SOURCE for
# this to fire: gnulib's config.h defines it as 2 whenever __OPTIMIZE__ is set, and config.h is the
# first include of every translation unit in a gnulib project, so it happens at -O1 and above with
# nothing on the command line.
#
# It is not only the fortified headers either. bits/error.h uses __builtin_va_arg_pack with no
# fortify level involved, which is how tar stops on this at -O0 as well, and it stops a long way
# from the cause: the probe for error.h answers no, gnulib compiles its own error.h without the
# system declaration behind it, and what surfaces is an implicit declaration of error at the first
# call site.
[fortify-builtins]
summary = "__builtin_object_size, the __builtin___*_chk family and __builtin_va_arg_pack, which glibc's fortified headers and its error.h are written in"
kind = "gnu-builtin"
diagnostic = [
    "implicit declaration of function '__builtin___",
    "implicit declaration of function '__builtin_va_arg_pack",
    "`__builtin_object_size` is not implemented yet",
]
rucc-issue = "https://github.com/tamnd/rucc/issues/825"
standard = "GNU extension with no portable spelling"

[function-pointers]
summary = "calls through a pointer, including pointers to library functions"
kind = "standard"

[inline-asm]
summary = "__asm__ at file scope, including .incbin and hand written section directives"
kind = "gnu-extension"

[integer-conversion]
summary = "the integer types are the widths the standard says they are, and conversions between them keep their values"
kind = "standard"

[k-and-r-idioms]
summary = "declarations and calls in the shape C had before it was standardised, which a compiler defaulting to C23 rejects"
kind = "standard"
standard = "old style definitions and implicit int were removed in C23; -std=gnu17 and earlier accept them"

[large-switch]
summary = "a switch with hundreds of cases, where the jump table decision is the compiler's"
kind = "standard"

[libm-builtins]
summary = "__builtin_ceil, __builtin_floor and the rest of the libm shaped builtins"
kind = "gnu-builtin"
rucc-issue = "https://github.com/tamnd/rucc/issues/226"

[long-double]
summary = "long double at the 80 bit x86-64 format"
kind = "standard"

[lto]
summary = "link time optimization across translation units"
kind = "lto"
diagnostic = ["unknown option `-flto`"]
rucc-issue = "https://github.com/tamnd/rucc/issues/658"

[memcpy-idioms]
summary = "__builtin_memcpy and __builtin_memset expanded inline at a size the compiler can see"
kind = "gnu-builtin"
standard = "GNU builtin; the portable spelling is a call to memcpy that the compiler is expected to recognise"

[nan-boxing]
summary = "a double written to a union and read back as a uint64_t, with a pointer and a tag living in the payload of a quiet NaN"
kind = "standard"

# The diagnostic is one string for two different bugs and there is no way to tell them apart from
# the text, which is worth knowing before anybody trusts the classification. E0694 is printed when
# the implementation cannot find a type wide enough to hold every value the operation could produce.
# jtckdint reaches it with operands that really are 128 bits wide, which is tamnd/rucc#602 and waits
# on the type existing at all. bash reaches it with nothing wider than 64 bits anywhere, because a
# signed 64 operand and an unsigned 64 result have no common type and the answer is computed by
# widening rather than from the operand signs, which is tamnd/rucc#836. Same words, different fix.
[overflow-builtins]
summary = "__builtin_add_overflow, __builtin_sub_overflow and __builtin_mul_overflow, including the mixed signedness forms that gnulib's ckd_add generates"
kind = "gnu-builtin"
diagnostic = ["needs an integer type wider than 64 bits for these arguments"]
rucc-issue = "https://github.com/tamnd/rucc/issues/836"
standard = "GNU extension; C23 <stdckdint.h> is the portable spelling"

[pointer-arithmetic]
summary = "arithmetic on object interiors, one past the end comparisons, and pointer differences"
kind = "standard"

[recursion-depth]
summary = "recursion deep enough that the frame layout and the tail call decision both matter"
kind = "standard"

[rotate-idioms]
summary = "a shift left or-ed with a shift right recognised as one rotate instruction"
kind = "standard"

[setjmp-longjmp]
summary = "setjmp and longjmp as an error mechanism, which constrains what the optimizer may keep in a register"
kind = "standard"

# Two spellings of one demand, and rucc is missing the same thing under both of them, which is why
# they are one entry with two needles. A variable length array and a call to alloca both ask the
# frame to grow by an amount that is not known until the function runs, and both ask for it to
# shrink again at the end of the block. The shrinking is the part that carries the weight: an alloca
# inside a loop that never gives the space back grows the frame on every trip, so a compiler that
# implements the growing and not the release has not implemented this.
[stack-allocation]
summary = "an array whose size is a runtime value, spelled either as a C99 variable length array or as a call to alloca, and a frame that grows and shrinks to hold it"
kind = "standard"
diagnostic = [
    "`__builtin_alloca` is not implemented yet",
    "no rule lowers a `stacksave`",
]
rucc-issue = "https://github.com/tamnd/rucc/issues/631"
standard = "variable length arrays are C99 and optional from C11 onward; alloca is a GNU and BSD extension with no portable spelling"

[stdckdint]
summary = "<stdckdint.h> and ckd_add, ckd_sub and ckd_mul"
kind = "standard"
standard = "C23"

[struct-layout]
summary = "struct offsets, padding and alignment as the ABI states them"
kind = "abi"

[switch-dispatch]
summary = "a state machine written as a switch, with deliberate fall through between cases"
kind = "standard"

[thread-local]
summary = "_Thread_local and __thread"
kind = "standard"

# The attribute is used in two directions and only one of them can be classified from the log. An
# assignment between a pointer to the union taking function and a pointer to the member taking one,
# which is what gnulib's SIGNATURE_CHECK does, prints both types and the word union is in the
# printed one, so the needle below is safe. A call that passes a member where the union is declared
# is refused with `incompatible type for argument 1 of f`, which names no type at all and would
# match every ordinary argument mismatch in the corpus, so it is deliberately not listed here.
[transparent-union]
summary = "__attribute__((transparent_union)) on a parameter, which glibc's sockaddr argument is declared with"
kind = "gnu-extension"
diagnostic = ["incompatible pointer type 'int (*)(int, union <anonymous>"]
rucc-issue = "https://github.com/tamnd/rucc/issues/829"
standard = "GNU extension with no portable spelling"

[unaligned-access]
summary = "loads and stores through pointers the compiler cannot prove are aligned"
kind = "standard"

[varargs-depth]
summary = "varargs forwarded through several layers of function"
kind = "standard"

[visibility-attributes]
summary = "__attribute__((visibility)) on functions and on objects"
kind = "gnu-extension"
