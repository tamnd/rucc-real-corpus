[project]
name = "brotli"
rung = 2
upstream = "https://github.com/google/brotli"
licence = "MIT"
licence-file = "LICENSE"
description = "google's compression format, a huffman decoder driven by one very large state machine switch"
# The decoder is a switch over a running state with about forty cases, entered and re-entered as
# input arrives, which is a different shape from an interpreter loop and is worth having next to
# one. The bit reader underneath it does the rest: brotli reads codes that are not byte aligned
# and are not a fixed width, so almost every line of it is a shift and a mask.
demands = ["switch-dispatch", "bit-manipulation", "cmake-probes"]

# The tag snapshot, which is fine for a cmake project because cmake generates the build from a
# CMakeLists.txt that is in the tree. An autoconf project pinned this way would need autoreconf.
[source]
url = "https://github.com/google/brotli/archive/refs/tags/v1.2.0.tar.gz"
sha256 = "816c96e8e8f193b40151dad7e8ff37b1221d019dbcb9c35cd3fadbfe6477dfec"
strip-components = 1

[build]
system = "cmake"

# Fourteen under gcc 16.2.0, and they are the right fourteen. Twelve are roundtrip tests that
# compress a file at a quality setting and decompress it again and check they got back what they
# started with, which is the only thing worth asking a compressor. The other two decompress files
# that were compressed years ago by something else, which is the check that the format did not
# quietly move.
[test]
command = ["ctest", "--test-dir", "build", "--output-on-failure"]
oracle = "suite"
parser = "ctest"
baseline-tests = 14

[limits]
build-seconds = 1800
test-seconds = 1800
