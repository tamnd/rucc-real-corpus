[project]
name = "tar"
rung = 4
upstream = "https://www.gnu.org/software/tar/"
licence = "GPL-3.0-or-later"
licence-file = "COPYING"
description = "GNU tar, graded by two hundred and forty four autotest cases that write archives and read them back"
# tar is here for the header fields, which are the place where a compiler's arithmetic becomes a
# file format other programs have to read. Every numeric field in a tar header is a fixed width
# array of char holding an octal string, and when a value does not fit, GNU tar switches to base
# 256 and writes the number a byte at a time. `to_base256` in src/create.c builds the sign
# extension it needs with `((uintmax_t) - negative << (CHAR_BIT * sizeof v - LG_256))`, which is a
# bool negated into an unsigned type and then shifted by a width computed from sizeof, and then
# writes each digit as `v & ((1 << LG_256) - 1)` into a char. `to_chars` around it decides between
# octal, base 256 and a modulo 2 to the field width fallback by comparing the value against
# `MAX_VAL_WITH_DIGITS (size - 1, LG_8)`, all in uintmax_t. That is what integer-conversion names,
# and getting it wrong produces an archive that this tar can read and another tar cannot.
#
# struct-layout is the other half of the same format. `union block` in src/tar.h overlays six header
# structs on one 512 byte buffer, and the code reads a field out of whichever member the format
# calls for. Nothing in the file asserts the size, so a compiler that pads `struct posix_header`
# differently than the format says silently moves every field after the padding, and the archive it
# writes is wrong in a way no diagnostic reports.
#
# fortify-builtins is the measured blocker, the one sed found. gnulib's config.h defines
# `_FORTIFY_SOURCE` as 2 whenever `__OPTIMIZE__` is set, config.h is the first include of every file
# in the tree, and the fortified headers are written in builtins rucc does not have. tamnd/rucc#825.
#
# Left off: pointer-arithmetic, true of the buffer code and carried by sixteen rows already, and
# feature-test-macros, which is not what stops this one.
demands = ["fortify-builtins", "integer-conversion", "struct-layout"]

[source]
url = "https://ftp.gnu.org/gnu/tar/tar-1.35.tar.xz"
sha256 = "4d62ff37342ec7aed748535323930c7cf94acf71c3591882b26a7ea50f3edc16"
strip-components = 1

# A3, ordinary autoconf and automake, and the level needs no carrier: configure takes CFLAGS out of
# the environment and automake puts it on every compile and on the link.
#
# There is one thing worth knowing about configuring tar and it is why section 7.12 matters here.
# tar's configure refuses to run as root without `FORCE_UNSAFE_CONFIGURE=1`, because some of its
# probes create files with owners and modes that are unsafe to make in a directory root can be
# tricked about. The harness drops privilege before it configures, so nothing has to be set, and a
# run forced back with `--as-root` fails at configure with that message rather than mysteriously.
[build]
system = "configure"
expect-configure = [
    "checking whether the compiler supports GNU C... yes",
    "checking for C/C++ restrict keyword... __restrict__",
]
# The program the suite runs, and the only one worth measuring. Measured through the harness at -O2
# it is 484672 bytes with 403679 of text.
binary = "src/tar"

# tar's suite is autotest and not automake, so there are no `# PASS:` blocks to sum. What it prints
# is one line per case, `NNN: name  ok` or `skipped (file.at:NN)` or `FAILED (file.at:NN)`, and then
# a summary that changes shape depending on whether anything failed. Counting the case lines is the
# stable thing to do, which is the same reason toybox, pdpmake, janet and tcc count their own.
#
# The run count is passes plus failures and leaves the skips out, as everywhere else here.
#
# gcc 16.2.0 on the reference machine gives 218 of 218 with 26 skipped, running as an ordinary user.
# The skips are the ones that need something the machine or the account does not have: the access
# control list and extended attribute cases, the capabilities case, the selinux cases, and the star
# compatibility cases that want archives too large to keep in the tree.
#
# Root would change this, which is the other reason section 7.12 applies to this project. Several
# cases check what tar does when it cannot read a file or cannot change an owner, and root can do
# both, so the same suite grades a different program.
[test]
command = [
    "sh",
    "-c",
    "make check > rrc-suite-output.log 2>&1; status=$?; cat rrc-suite-output.log; awk '/^ *[0-9]+: /{ if ($0 ~ / ok$/) passed++; else if ($0 ~ /FAILED/) failed++ } END { printf \"tar: %d of %d tests passed\\n\", passed, passed + failed }' rrc-suite-output.log; exit $status",
]
oracle = "suite"
parser = "custom-regex"
regex = "tar: (\\d+) of (\\d+) tests passed"
baseline-tests = 218
requires = ["sh", "awk"]

# Configure is the expensive half, the same shape as the other gnulib rows: a few hundred compiles
# of ten line programs. The suite is slower than sed's because most of its cases fork tar at least
# twice, once to write an archive and once to read it back, and several of them build archives of a
# few megabytes first.
[limits]
build-seconds = 1800
test-seconds = 1200
