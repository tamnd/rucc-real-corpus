[project]
name = "fribidi"
rung = 2
upstream = "https://github.com/fribidi/fribidi"
licence = "LGPL-2.1-or-later"
licence-file = "COPYING"
description = "the unicode bidirectional algorithm as a small c library, and the first project here that meson configures"
# meson-probes is why it is here. Meson decides what the compiler is from what it prints for
# --version and what it predefines before it asks it anything else, and a compiler it does not
# recognise stops the setup at the first line, so this row is the first one that can say whether
# rucc gets through that at all. After that it asks for three functions and five headers and
# writes the answers into config.h, which is small enough for a difference to be read by eye.
# The other two are the library. The bidi types are bit masks tested and combined all through
# the algorithm, and every table of them comes from one list header included several times over
# with a different macro defined each time.
demands = ["meson-probes", "bit-manipulation", "deep-macros"]

# The release tarball rather than the tag snapshot. It ships a generated configure as well as
# meson.build, and the configure is left alone: the point of the row is the meson build, and the
# autotools one is what libpsl and a dozen others already cover.
[source]
url = "https://github.com/fribidi/fribidi/releases/download/v1.0.17/fribidi-1.0.17.tar.xz"
sha256 = "6949dcde27d41cebad1fd741fcafc36d55a1020d2d872d4a6eb3914caabbada2"
strip-components = 1

[build]
system = "meson"
# Its own documented switch, section 9.3 case one. The documentation is built with c2man, which
# is on no host this corpus runs on, and it is man pages rather than code. Everything else is left
# at upstream's defaults, tests included.
#
# Nothing here asks for a host compiler, and that is worth knowing before reading a failure. The
# unicode tables are generated at build time by small programs under gen.tab that meson marks
# native, and on a build that is not a cross build the native compiler is the same `CC` as
# everything else. So the tables are written by programs the compiler under test compiled, and a
# miscompile there shows up as a conformance failure in a library that looks correct.
configure = ["-Ddocs=false"]

# Nine, counted from the test() calls in the pinned tree rather than from a gcc run, and meson
# counts one per test program or script. Six are the charset tests in test/meson.build, each a
# python script that runs bin/fribidi over an input and compares with a checked in reference. One
# is test-reorder-nsm. The last two are the conformance programs in test/unicode-conformance, which
# read BidiTest.txt and BidiCharacterTest.txt from the Unicode Consortium, about six hundred
# thousand lines between them, so two of the nine are most of the evidence. The fuzzer tests in the
# same file only exist when fuzzer_ldflags is set, and it is not.
#
# The timeout multiplier is there because meson gives each test thirty seconds by default, and a
# conformance program built at -O0 by a compiler that is still young can spend longer than that
# on half a million lines without being wrong. The harness still has its own limit below.
[test]
command = ["meson", "test", "-C", "build", "--print-errorlogs", "-t", "10"]
oracle = "suite"
parser = "meson"
baseline-tests = 9
requires = ["meson", "python3"]

[limits]
build-seconds = 900
test-seconds = 900
