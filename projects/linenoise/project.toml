[project]
name = "linenoise"
rung = 1
upstream = "https://github.com/antirez/linenoise"
licence = "BSD-2-Clause"
licence-file = "LICENSE"
description = "a line editing library that talks to a terminal through ioctl and a raw mode struct"
demands = ["struct-layout", "function-pointers"]

[source]
url = "https://codeload.github.com/antirez/linenoise/tar.gz/a473823d74b93eab2ba83480df16ed37617493f2"
sha256 = "3db03aba739bc96f3da3133b9615ccc43246ba2c3628b403b00a470abd3b6a8d"

# Two programs, because the test forks and execs the example and grades what comes back over the
# pty. The Makefile is not usable here: it writes -Os into the recipe rather than into a variable,
# so no make variable carries the level. Spec 07.9 is why this shape exists.
[build]
system = "direct"

[[build.program]]
output = "linenoise-example"
sources = ["linenoise.c", "example.c"]

[[build.program]]
output = "linenoise-test"
sources = ["linenoise.c", "linenoise-test.c"]

[test]
command = ["./linenoise-test"]
oracle = "suite"
parser = "custom-regex"
regex = "Tests passed: (\\d+)"
baseline-tests = 102
requires = ["sh"]
