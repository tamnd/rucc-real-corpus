[project]
name = "monocypher"
rung = 1
upstream = "https://monocypher.org/"
licence = "CC0-1.0 OR BSD-2-Clause"
licence-file = "LICENCE.md"
description = "a compact crypto library written to run in constant time whatever the key is"
demands = ["constant-time", "integer-conversion"]

# The release tarball rather than a commit archive, because the GitHub archive does not carry
# tests/vectors.h and `make test` then asks for libsodium to generate one.
[source]
url = "https://monocypher.org/download/monocypher-4.0.2.tar.gz"
sha256 = "38d07179738c0c90677dba3ceb7a7b8496bcfea758ba1a53e803fed30ae0879c"

[build]
system = "make"
# `static-library` rather than the default `all`, because `all` also links the shared object with
# -Wl,-soname, which the macOS linker does not take. The test target does not need it.
targets = ["static-library"]

# No level-flags. The Makefile says `CFLAGS ?= -O3`, which is the conditional form, so the level
# from the environment is the one that survives.

# The suite runs the shipped vectors through every primitive and diffs the results, so the exit
# status is the answer and the last line says so.
[test]
command = ["make", "test"]
oracle = "self-checking"

# The library is one file and the suite is another, which is the split the cross check wants without
# having to invent one. The seed the suite uses is a constant in utils.c and nothing reads a clock or
# an environment variable, so the same build prints the same thousand lines every time.
[abi.archive]
output = "libmonocypher-abi.a"
sources = ["src/monocypher.c", "src/optional/monocypher-ed25519.c"]

[abi.driver]
output = "monocypher-abi"
sources = ["tests/test.c", "tests/utils.c"]

[[abi.flags]]
flag = "-Isrc"
why = "the headers sit beside the sources and everything includes them by bare name, which is what MAIN_I in the makefile is"

[[abi.flags]]
flag = "-Isrc/optional"
why = "monocypher-ed25519.h is there and the suite includes it by bare name"

[[abi.flags]]
flag = "-Itests"
why = "the suite includes utils.h and vectors.h by bare name, which is the -I tests that TEST_I adds"
