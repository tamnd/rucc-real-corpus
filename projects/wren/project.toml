[project]
name = "wren"
rung = 3
upstream = "https://github.com/wren-lang/wren"
licence = "MIT"
licence-file = "LICENSE"
description = "a small class based scripting language whose own suite is eight hundred programs with their expected output written in the comments"
# The dispatch loop is a computed goto by default under any compiler that is not MSVC, and a Value
# is a double with a pointer and a tag folded into the payload of a quiet NaN, which is written as
# a union and read back the other way round. The foreign function interface is calls through
# pointers the test binary installs, which is what most of the api directory is.
demands = ["computed-goto", "nan-boxing", "function-pointers"]

# The commit rather than a tag, because wren's last release is 0.4.0 from 2021 and the tree has
# moved a long way since without a new one. spec 6.3 takes a commit for exactly this case and the
# hash below is the tarball, so the pin is the bytes rather than a name that can be repointed.
[source]
url = "https://codeload.github.com/wren-lang/wren/tar.gz/99d2f0b8fc2686134b32b18166e037639f7e9f2c"
sha256 = "530336e051cda4a4042c41d1e0b401c9dffa16e01513240166f15e4e333cee8f"
strip-components = 1

# Direct rather than the makefile upstream ships, and the reason is the one picohttpparser has
# only worse. projects/make is generated by premake and every configuration in it says
# `ALL_CFLAGS += $(CFLAGS) $(ALL_CPPFLAGS) -m64 -O2 -std=c99`, so the level the environment asks
# for lands before a literal -O2 and the last -O on the line always wins. Four cells would be four
# copies of one measurement. There is no variable that goes after it, and overriding ALL_CFLAGS on
# the command line would take the include paths with it.
#
# The file list is the same twenty nine sources that makefile compiles, which is the whole vm, both
# optional modules, and the test binary with its foreign function tests. Nothing is left out and
# nothing is added.
[build]
system = "direct"
sources = [
  "src/vm/wren_compiler.c",
  "src/vm/wren_core.c",
  "src/vm/wren_debug.c",
  "src/vm/wren_primitive.c",
  "src/vm/wren_utils.c",
  "src/vm/wren_value.c",
  "src/vm/wren_vm.c",
  "src/optional/wren_opt_meta.c",
  "src/optional/wren_opt_random.c",
  "test/main.c",
  "test/test.c",
  "test/api/api_tests.c",
  "test/api/benchmark.c",
  "test/api/call.c",
  "test/api/call_calls_foreign.c",
  "test/api/call_wren_call_root.c",
  "test/api/error.c",
  "test/api/foreign_class.c",
  "test/api/get_variable.c",
  "test/api/handle.c",
  "test/api/lists.c",
  "test/api/maps.c",
  "test/api/new_vm.c",
  "test/api/reset_stack_after_call_abort.c",
  "test/api/reset_stack_after_foreign_construct.c",
  "test/api/resolution.c",
  "test/api/slots.c",
  "test/api/user_data.c",
]
# bin/wren_test rather than a name in the root, because util/test.py works out where the binary is
# from where the script is and looks in bin for it. The directory is not in the tarball, since
# upstream's generated makefile is what creates it, and the harness makes it for the same reason a
# build system would.
output = "bin/wren_test"
link = ["-lm"]

[[build.flags]]
flag = "-Isrc/include"
why = "wren.h is the public header and every file includes it by bare name"

[[build.flags]]
flag = "-Isrc/vm"
why = "the vm files include each other by bare name, which is what the generated makefile's include list does too"

[[build.flags]]
flag = "-Isrc/optional"
why = "wren_vm.c includes wren_opt_meta.h and wren_opt_random.h by bare name when the modules are on, and they are on by default"

[[build.flags]]
flag = "-Itest"
why = "the api tests include test.h from the directory above them"

# The suite is eight hundred and sixty six wren programs with their expected output written in
# comments beside the code they test, plus every example in the repository run as a test. test.py
# compares what the interpreter printed against what the comment said, line by line, so a wrong
# answer is caught rather than a crash being the only thing that shows. That is the strongest
# oracle shape on the ladder and it is why this project is worth its build.
[test]
command = ["python3", "util/test.py"]
oracle = "suite"
# The count is coloured. test.py wraps every number it prints in an ANSI escape unless it is on
# Windows, so the count arrives with a colour code in front of it and a reset immediately after,
# and the pattern has to say so or the digits run straight into an escape byte and nothing
# matches. Spelling the escape out also keeps the pattern from matching a number somewhere else
# in the output. The same line is printed whether or not anything failed, `All N tests passed` in
# the clean case and `N tests passed. M tests failed.` otherwise, and this matches both, which is
# what makes a shortfall show up as a number instead of as no count at all.
parser = "custom-regex"
regex = "\\[32m(\\d+)\\x1b\\[0m tests passed"
baseline-tests = 866
requires = ["python3"]

# Twenty nine translation units and a suite that forks the interpreter once per test, which is
# about ten seconds of process starts on the reference machine and most of the test time. The build
# limit is slack for a slow compiler rather than a real bound.
[limits]
build-seconds = 900
test-seconds = 600
