[project]
name = "lz4"
rung = 1
upstream = "https://github.com/lz4/lz4"
licence = "BSD-2-Clause"
licence-file = "LICENSE"
description = "a fast compressor built out of memcpy idioms and unaligned loads"
demands = ["memcpy-idioms", "unaligned-access"]

[source]
url = "https://codeload.github.com/lz4/lz4/tar.gz/ebb370ca83af193212df4dcbadcc5d87bc0de2f0"
sha256 = "eb1a93e934d4fd29df6e2061ba0bf447568561764d758f4a5662c0e29370ffa9"

[build]
system = "make"

# The whole of `make test` runs for several minutes and most of it is the command line tool driving
# generated files through a shell. The fuzzer and the frametest are the two that exercise the
# compressor itself, and twenty seconds of each is enough to catch a miscompiled match loop.
# Spec 5.2 has this down as a d3 suite. It is a d2, because what the fuzzers report is a round trip
# they checked themselves and a running count rather than a number of tests.
[test]
command = ["make", "-C", "tests", "test-fuzzer", "test-frametest", "FUZZER_TIME=-T20s"]
oracle = "self-checking"
