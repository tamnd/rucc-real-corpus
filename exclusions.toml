# The register from `spec/09-patches-and-exclusions.md` section 9.4.
# Every entry names an issue, because an exclusion with no issue is a project quietly removed from
# the denominator. The upstream prefix says whose bug it is and the url behind it is our own
# tracking issue, because none has been reported to its project yet and a register that points at an
# issue nobody filed is worse than one that points at a note somebody wrote.
#
# Eight entries, and they are not all the same kind of thing, which is worth saying before anybody
# reads the count as one number. Three were found while recording the gcc 16 baselines: a test that
# frees a null pointer and reads through it, a header whose own arithmetic stops holding once there
# are several of it in a link, and an internal compiler error in gcc's aarch64 back end. Two more,
# femtolisp and micropython, are source that does not build on macos arm64 for reasons that have
# nothing to do with the compiler under test. None of those five is about rucc and every one of them
# would be a false red against it.
#
# Two more are not a bug in anybody's code. janet and tcc run a different number of cases on macos
# than on linux, because parts of both suites are written for a linux facility and skip themselves
# elsewhere, and baseline-tests holds one number. So a host that runs fewer cases and passes all of
# them is graded a wrong answer for a difference in what the suite chose to run. That is
# tamnd/rucc-real-corpus#105 and it is a gap in this harness rather than in a project, which is the
# one kind of entry here that we are supposed to be able to remove by fixing something.
#
# The eighth is the only one that is about rucc, and section 9.4's own first two examples are that
# shape, so it is the ordinary kind rather than a new one. libmpfr asks configure whether the
# compiler knows _Decimal64, rucc says no because the three decimal types are deferred past 1.0, and
# two of its 198 test programs then skip themselves rather than test anything. The issue behind it is
# where the argument for the deferral is written down, and the entry comes out when the types land.
#
# An entry is as narrow as the failure it describes. The level field says which levels, the host
# field says which machines, and leaving either off means all of them. Five of the eight are scoped
# to macos-aarch64, and every one of those five passes at every level on the reference machine.
#
# Rechecked on 2026-09-19 against the RC5 exit criterion, which asks for no entry older than RC3
# without a dated justification. All eight carry a since date and an issue, and all eight stand.

[[exclude]]
project = "heatshrink"
case = "heatshrink"
level = "O0"
issue = "upstream:https://github.com/tamnd/rucc-real-corpus/issues/21"
why = "decoder_sink_should_reject_null_input_pointer allocates with a lookahead equal to the window size, which heatshrink_decoder_alloc is documented to reject, and then calls heatshrink_decoder_free on the null it got back. The free reads hsd->window_sz2 to compute a size its allocator does not use, so the test segfaults. At -O1 and above the read is dead and gcc deletes it, which is the only reason the other three levels pass, and that is worth remembering before reading a failure here at -O2 as a miscompilation."
since = "2026-09-07"

[[exclude]]
project = "incbin"
case = "incbin"
level = "O1,O2,Os"
issue = "upstream:https://github.com/tamnd/rucc-real-corpus/issues/22"
why = "the assertion that &gLoremData[gLoremSize] equals &gLoremEnd fails with gcc 16 at every level above -O0, and it fails without the comparison being made. The disassembly of main calls __assert_fail for line 18 unconditionally, so gcc decided the two addresses differ while compiling, and nm on the same binary shows them 962 bytes apart with gLoremSize being 962. The placement is right and so is the header's arithmetic. What the assertion does is compare a pointer one past the end of one declared object against the address of another, which C leaves undefined and gcc 16 folds, so the failure is in what the header's own test asks for rather than in anything a compiler laid out wrongly. The compiler under test passes all three cells because it does not make that fold, and this entry stays because a cell gcc cannot get through is not a comparison between the two of us."
since = "2026-09-07"

[[exclude]]
project = "xxhash"
case = "xxhash"
level = "O1"
host = "macos-aarch64"
issue = "upstream:https://github.com/tamnd/rucc-real-corpus/issues/41"
why = "gcc 16.2.0 on aarch64 apple darwin gives an internal compiler error, in aarch64_function_arg_alignment at config/aarch64/aarch64.cc:7524, compiling XXH3_len_0to16_64b inlined into XXH3_64bits at -O1. The crash is in the back end and the other three levels build and pass, so this is a gcc bug on this host and criterion 3 of section 3.2 says a cell gcc cannot produce is not evidence about us. It is scoped to the host it happens on, because the same cell on linux x86-64 has nothing wrong with it."
since = "2026-09-07"

[[exclude]]
project = "femtolisp"
case = "femtolisp"
level = "*"
host = "macos-aarch64"
issue = "upstream:https://github.com/tamnd/rucc-real-corpus/issues/100"
why = "llt/utils.h picks the word size and the byte order from a list of architecture macros that runs __i386__, __x86_64__, __ppc__, __ppc64__ and then #error \"unknown architecture\", and aarch64 falls off the end of it. gcc 16.2.0 cannot produce the cell either, so section 3.2 criterion 3 says it is not evidence about us, and the pin is from 2019 with nothing after it to pin past. Every level on linux x86-64 builds and passes, which is why this is scoped to the one host."
since = "2026-09-08"

[[exclude]]
project = "janet"
case = "janet"
level = "*"
host = "macos-aarch64"
issue = "https://github.com/tamnd/rucc-real-corpus/issues/105"
why = "The suite count is host dependent and baseline-tests holds one number. test/suite-filewatch.janet runs 45 cases against inotify on linux and 1 case anywhere else, so a run on this host comes back with 3751 of 3751 against a reference of 3795 and is graded a wrong answer for a reason that has nothing to do with the compiler. The 3751 it does run all pass. Scoped to the host, because the reference machine is where the number was taken and where every level passes."
since = "2026-09-09"

[[exclude]]
project = "tcc"
case = "tcc"
level = "*"
host = "macos-aarch64"
issue = "https://github.com/tamnd/rucc-real-corpus/issues/105"
why = "The same shape as janet and the same issue. Two of the nineteen sections make test runs are linux only, asm-c-connect-test and the PIC dlltest, so this host attempts 168 cases against a reference of 170 and is graded a wrong answer over two sections it was never going to run. Everything it does run passes and the suite exits zero. Scoped to the host, because every level passes on the reference machine."
since = "2026-09-09"

[[exclude]]
project = "micropython"
case = "micropython"
level = "*"
host = "macos-aarch64"
issue = "upstream:https://github.com/tamnd/rucc-real-corpus/issues/110"
why = "The port compiles with -Werror and py/misc.h writes its static assert as sizeof of a char array whose size is a comparison between two object addresses. That is not a constant expression, gcc folds it anyway and clang folds it and then warns about having folded it, so py/parse.c stops the build on this host before any question about the compiler under test is reached. Upstream guards the macro for msvc and for C++ and not for clang compiling C. Every level on linux x86-64 builds and passes, which is why this is scoped to the one host."
since = "2026-09-09"

[[exclude]]
project = "libmpfr"
case = "libmpfr"
level = "*"
issue = "https://github.com/tamnd/rucc/issues/1468"
why = "The three decimal floating types are deferred past 1.0 in section 7 of rucc's spec/07-types-and-semantics.md, and mpfr is the first thing here to ask for them. Its configure runs 'checking if compiler knows _Decimal64', gets no from rucc and yes from gcc 16.2.0, and turns MPFR_WANT_DECIMAL_FLOATS off for the whole build, after which tget_set_d64 and tget_set_d128 skip themselves at run time rather than test anything. So the cell reads 196 of 198 with two skips against gcc's 198 of 198 and is graded a wrong answer, which is the right grade: rucc covered less than gcc did and the reason is a type it does not have. The other 196 pass at every level, including the ones that assert exact bit patterns at every rounding mode, which is what this project is on the list for. Not scoped to a host, because a deferred type is absent on all of them."
since = "2026-09-19"
