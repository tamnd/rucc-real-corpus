[project]
name = "busybox"
rung = 4
upstream = "https://busybox.net/"
licence = "GPL-2.0"
licence-file = "LICENSE"
description = "the other four hundred command line tools in one binary, built from a configuration it writes itself"
# `inline-asm` because busybox is the first row on the list that has hand written x86-64 in a path
# the build actually takes. libbb/bitops.c guards a block of movups and xorps on `#if
# defined(__SSE__)`, which every x86-64 target has, so the guard is not a guard here and a compiler
# that does not assemble that block cannot build libbb. networking/tls_sp_c32.c has five more
# blocks, and those are worse: they are the bignum multiply and carry chains of the TLS
# implementation, written with explicit registers and the carry flag, and a compiler that assembles
# them wrongly produces a TLS client that computes wrong numbers rather than one that fails to link.
#
# `driver-stdin-input` because scripts/gcc-version.sh line 11 pipes the two tokens `__GNUC__` and
# `__GNUC_MINOR__` into `$(CC) -E -xc -` and reads the compiler's version out of what comes back.
# That is the only place in the corpus so far where a build asks the driver a question through a pipe
# rather than through a file, and it is the demand cc-option rests on as well, because every one of
# the twenty flags Makefile.flags probes is tested by compiling `-xc /dev/null`.
#
# `driver-passthrough` because kbuild writes `-Wp,-MD,<depfile>` at the front of every compile line
# it generates, in scripts/Makefile.lib line 111 for the target files and scripts/Makefile.host line
# 101 for the host tools. No other row on the list asks for that flag and every project that
# borrowed kbuild asks for it on every file, so this is the row that finds it. It is also the
# blocker, tamnd/rucc#863: the generated headers and the two host tools are made, and then the build
# stops on the first object it compiles out of busybox's own source.
#
# Left off, and the first of these was on the list until the row was measured. char-signedness,
# because Makefile.flags line 60 asks for -funsigned-char through cc-option and the probe never gets
# far enough to ask: it fails on `-xc /dev/null` like the other nineteen, so what this row measures
# there is driver-stdin-input a second time rather than the flag, and toybox already carries the
# demand in the loud form, on the command line where a compiler that will not take it cannot build a
# single file. stack-allocation, which shell/math.c:687 sizes two stacks with and which bash and git
# already carry. unaligned-access, which BB_UNALIGNED_MEMACCESS_OK turns on and which xorbuf_3 uses
# to copy a long at a time out of any pointer it is handed. deep-macros, which the applet table is.
demands = ["driver-passthrough", "driver-stdin-input", "inline-asm"]

# 1.38.0 is the current release. The bzip2 tarball is what upstream publishes first and it is 2.6 MB
# against 5.4 for the same tree gzipped, which is the project demonstrating its own subject matter.
[source]
url = "https://busybox.net/downloads/busybox-1.38.0.tar.bz2"
sha256 = "34f9ea6ff8636f2c9241153b9114eefa9e65674a45318ae1ef95bb5f31c53bb2"
strip-components = 1

# A1 by the letter of the axis and the most interesting build on the rung by any other measure. The
# Makefile is kbuild, the same machinery the kernel uses, and what it does before it compiles
# anything is build two host tools and generate a header per applet from the configuration.
[build]
system = "make"
binary = "busybox"

# The one thing this row needs that nothing else on the list does, and the reason spec 7.13 exists.
#
# busybox decides what to compile from a file its own `make defconfig` writes, and defconfig turns
# on every applet there is, including tc. tc has not compiled against a current kernel header for
# several years: networking/tc.c reads TCA_CBQ_MAX, TCA_CBQ_RATE, struct tc_cbq_lssopt and eleven
# more names that were taken out of linux/pkt_sched.h, and upstream has left the applet where it is.
# gcc 16.2.0 gives twenty two errors in that one file on this machine and builds everything else.
#
# So a row without this field would report the age of a kernel header at every level under both
# compilers, and the alternatives were all worse: a sed hidden in a test command, an exclusion on a
# row that builds fine, or a fork of the tarball. The field turns the symbol off in the spelling
# kconfig itself uses, and it can do that and nothing else.
[build.config]
target = "defconfig"
file = ".config"
disable = ["CONFIG_TC"]
why = "networking/tc.c reads TCA_CBQ_MAX and thirteen more names that linux/pkt_sched.h stopped defining several years ago, so gcc 16 fails on it too and the applet is a header the project is behind on rather than a compiler result"

# EXTRA_CFLAGS and not CFLAGS, and this is a two line proof. Makefile.flags line 91 appends the
# level itself, `cc-option -Oz, else -Os, else -O2`, to CFLAGS whenever CONFIG_DEBUG is off, which
# defconfig leaves off. So a level exported as CFLAGS arrives first and busybox's own choice arrives
# after it and wins. scripts/Makefile.lib line 89 builds every compile line as
# `$(CFLAGS) $(EXTRA_CFLAGS) $(CFLAGS_$(*F).o)`, which puts EXTRA_CFLAGS after the level busybox
# picked, and make takes a command line assignment over anything the makefiles say.
#
# CONFIG_EXTRA_CFLAGS is a different thing with a similar name. It is a string in the configuration
# that Makefile.flags line 138 appends to CFLAGS, and it would work as a carrier, but it would mean
# rewriting the configuration for something that is not a symbol being turned off.
[build.level-flags]
variable = "EXTRA_CFLAGS"
why = "Makefile.flags line 91 puts busybox's own -Os into CFLAGS, and scripts/Makefile.lib line 89 puts $(EXTRA_CFLAGS) after $(CFLAGS) on every compile line"

# `make test` is Makefile.custom line 71, it depends on busybox and busybox.links, and it runs
# testsuite/runtest, which prints one line per case: `PASS: name`, `FAIL: name`, `UNTESTED: name`
# when the case names a config symbol that is off, and `SKIPPED: applet (not built)` for a whole
# applet that is not in the binary. There is no total anywhere, so the counting is done here with
# awk, which is the shape toybox, pdpmake, janet, tcc and micropython already use.
#
# The run count is passes plus failures. UNTESTED and SKIPPED are left out for the reason they
# always are: both are decided by reading the configuration before a case runs, so neither says
# anything about a compiler, and a row that counted them would move its own denominator the first
# time defconfig changed its mind about an applet.
[test]
command = [
    "sh",
    "-c",
    "make test > rrc-suite-output.log 2>&1; status=$?; cat rrc-suite-output.log; awk '/^PASS: /{ passed++ } /^FAIL: /{ failed++ } END { printf \"busybox: %d of %d tests passed\\n\", passed, passed + failed }' rrc-suite-output.log; exit $status",
]
oracle = "suite"
parser = "custom-regex"
regex = "busybox: (\\d+) of (\\d+) tests passed"
# Nine cases fail under GCC 16.2.0 on the reference machine, at every level, and the failing set is
# byte identical at all six, so the pair of numbers below is what a green row looks like here and
# `baseline-total` is what says so. The nine are four different things and none of them is a
# compiler.
#
# Four are bugs busybox knows about and wraps in its own `SKIP_KNOWN_BUGS` guard, with the
# incompatibility written out in a comment above each: `sed embedded NUL`, `sed NUL in command`,
# `sed nonexistent label` and `cpio lists hardlinks`. The guard is deliberately not set here. Setting
# it would hide the same four cases from both compilers, and a case upstream expects to fail is still
# a case that has to fail the same way on both sides of a differential.
#
# Three are the host shell. ls.tests builds a filename out of `printf "\x01\x02..."`, and /bin/sh on
# this machine is dash, whose printf leaves `\x41` as five characters. The bytes the three `ls -q`,
# `ls -Q` and `ls -qQ` cases are about are never created, so the cases fail before busybox is asked
# anything. A host whose /bin/sh expands them scores three higher, which grades green, because the
# rule is `run` equal to the total and `passed` at or above the baseline.
#
# One is the harness. `tar writing into read-only dir` extracts into a directory it has just made
# mode `dr-xr-x---`, which works when the suite runs as root and does not when it runs as anybody
# else, and section 7.12 has this one running as an unprivileged user on purpose.
#
# One says its own reason in its own name: `taskset (set_aff, needs CAP_SYS_NICE)`.
baseline-tests = 1011
baseline-total = 1020
# `zip` is required rather than optional for the reason gzip's `perl` is. unzip.tests line 23 builds
# its own archive with the host `zip` and then asks busybox to extract it, and a host without the
# tool does not skip that case, it fails it. The reference machine did not have zip when this row was
# first measured and came in one case short, which is exactly the shape of a baseline nobody can
# read. Naming it here turns a wrong number into a refusal to start.
requires = ["sh", "awk", "zip"]

# Both sized from the lto cell and both about three times it, which is the rule git's row settled on.
# The reference builds busybox in 115 seconds at -O0 and 569 at lto, and the second number is the one
# the budget is for. The test budget is the surprise: the phase takes 120 to 140 seconds at the
# ordinary levels and 564 at lto, and most of that is not the suite. `make test` depends on the
# binary, the applet table is regenerated on the way in, seven objects follow it, and then busybox
# links itself five times over to find out which libraries it can do without. Five link time
# optimized links of four hundred applets is most of nine minutes.
[limits]
build-seconds = 1800
test-seconds = 1800
