# The register from `spec/09-patches-and-exclusions.md` section 9.4.
# Every entry names an issue, because an exclusion with no issue is a project quietly removed from
# the denominator. All three entries here are upstream failures found while recording the gcc 16
# baselines, which is to say none of them is about rucc and all of them would be a false red
# against it. The upstream prefix says whose bug it is and the url behind it is our own tracking
# issue, because none has been reported to its project yet and a register that points at an issue
# nobody filed is worse than one that points at a note somebody wrote.
#
# An entry is as narrow as the failure it describes. The level field says which levels, the host
# field says which machines, and leaving either off means all of them. All three were rechecked
# against the first full differential run on linux x86-64 on 2026-09-07 and all three stand.

[[exclude]]
project = "heatshrink"
case = "heatshrink"
level = "O0"
issue = "upstream:https://github.com/tamnd/rucc-real-corpus/issues/21"
why = "decoder_sink_should_reject_null_input_pointer allocates with a lookahead equal to the window size, which heatshrink_decoder_alloc is documented to reject, and then calls heatshrink_decoder_free on the null it got back. The free reads hsd->window_sz2 to compute a size its allocator does not use, so the test segfaults. At -O1 and above the read is dead and gcc deletes it, which is the only reason the other three levels pass, and that is worth remembering before reading a failure here at -O2 as a miscompilation."
since = "2026-09-07"

[[exclude]]
project = "incbin"
case = "incbin"
level = "O1,O2,Os"
issue = "upstream:https://github.com/tamnd/rucc-real-corpus/issues/22"
why = "the assertion that &gLoremData[gLoremSize] equals &gLoremEnd fails with gcc 16 on linux x86-64 and on macos arm64 alike, at every level above -O0, while a translation unit with a single INCBIN in it still lays the symbols out adjacently. The header's own arithmetic is right and the placement stops being right once there are several of them, so this is a header and toolchain disagreement rather than anything the compiler under test did."
since = "2026-09-07"

[[exclude]]
project = "xxhash"
case = "xxhash"
level = "O1"
host = "macos-aarch64"
issue = "upstream:https://github.com/tamnd/rucc-real-corpus/issues/41"
why = "gcc 16.2.0 on aarch64 apple darwin gives an internal compiler error, in aarch64_function_arg_alignment at config/aarch64/aarch64.cc:7524, compiling XXH3_len_0to16_64b inlined into XXH3_64bits at -O1. The crash is in the back end and the other three levels build and pass, so this is a gcc bug on this host and criterion 3 of section 3.2 says a cell gcc cannot produce is not evidence about us. It is scoped to the host it happens on, because the same cell on linux x86-64 has nothing wrong with it."
since = "2026-09-07"

[[exclude]]
project = "femtolisp"
case = "femtolisp"
level = "*"
host = "macos-aarch64"
issue = "upstream:https://github.com/tamnd/rucc-real-corpus/issues/100"
why = "llt/utils.h picks the word size and the byte order from a list of architecture macros that runs __i386__, __x86_64__, __ppc__, __ppc64__ and then #error \"unknown architecture\", and aarch64 falls off the end of it. gcc 16.2.0 cannot produce the cell either, so section 3.2 criterion 3 says it is not evidence about us, and the pin is from 2019 with nothing after it to pin past. Every level on linux x86-64 builds and passes, which is why this is scoped to the one host."
since = "2026-09-08"
