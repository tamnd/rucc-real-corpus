[workspace]
members = [
    "crates/rrc",
    "crates/rrc-fetch",
    "crates/rrc-manifest",
    "crates/rrc-report",
    "crates/rrc-run",
]
resolver = "3"

[workspace.package]
version = "0.3.6"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/tamnd/rucc-real-corpus"

[workspace.dependencies]
# These track the workspace version above and have to be bumped with it. A requirement left at an
# older patch keeps resolving until the minor bumps and then stops matching at all, which is a
# build that breaks on the release commit rather than on the change that caused it.
rrc-fetch = { path = "crates/rrc-fetch", version = "0.3.6" }
rrc-manifest = { path = "crates/rrc-manifest", version = "0.3.6" }
rrc-report = { path = "crates/rrc-report", version = "0.3.6" }
rrc-run = { path = "crates/rrc-run", version = "0.3.6" }
regex = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
serde_json = "1"
sha2 = "0.10"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
strip = true
