[project]
name = "xz"
rung = 4
upstream = "https://tukaani.org/xz/"
licence = "0BSD"
licence-file = "COPYING.0BSD"
description = "a compressor and the liblzma behind it, graded by a suite that round trips its own output"
# `bit-builtins` because of __builtin_bswap16, 32 and 64, and the reason it is first is in the
# `expect-configure` note below rather than here.
#
# `struct-layout` because a .xz file is a stream header, a sequence of blocks each with its own
# header, an index and a stream footer, and block.h, index.h and stream_flags_common.h describe
# layouts that another implementation has to agree with byte for byte. Getting an offset wrong here
# does not crash anything, it writes an archive nobody else can read.
#
# `autoconf-probes` because this is the largest configure script in the corpus, better than two
# hundred and nineteen checks, and because it is where the compiler under test stops today. rucc
# 0.10.4 never reaches a line of xz's own source.
#
# Left off: `bit-manipulation`, which is true of the range coder in rc_encoder.h and the match
# finders in lz_encoder_mf.c and is as central here as anywhere, but twelve projects already carry
# it and there are only three slots. Also left off `constant-time`, which was on an earlier draft of
# this file and should not have been: xz computes checksums, it does not keep secrets, and nothing
# in the tree asks for timing independence.
demands = ["bit-builtins", "struct-layout", "autoconf-probes"]

# spec/05-the-projects.md pins 5.8.1 and this is that release tarball, taken from the project's own
# GitHub releases rather than from a codeload snapshot, because the release ships a generated
# configure and that keeps autoreconf off the list of tools the harness has to have.
[source]
url = "https://github.com/tukaani-project/xz/releases/download/v5.8.1/xz-5.8.1.tar.gz"
sha256 = "507825b599356c10dca1cd720c9d0d0c9d5400b9de300af00e4d1ea150795543"
strip-components = 1

# A3, ordinary autoconf through automake and libtool, and the level needs no carrier. configure
# takes CFLAGS out of the environment and writes `CFLAGS = -O2` into src/xz/Makefile, and line 203
# of that file puts `$(CFLAGS)` on the libtool link line as well as line 192 putting it on every
# compile. The link half is what decides whether lto means anything and it was read out of the
# generated makefile rather than assumed.
#
# The six gcc builds come out at six different sizes, 122,320 bytes at -O3 down to 102,768 at -Os,
# which is the check that the level reaches the compiler rather than being dropped.
#
# The licence file is COPYING.0BSD and not COPYING. The latter is an index that explains which of
# the four licence files applies to which part of the tree, and the code this corpus compiles is the
# 0BSD part.
[build]
system = "configure"
# The second line is the one that earns its place, and it is the same argument libjansson's atomics
# line is built on. m4/tuklib_integer.m4 line 27 probes for the byte swap builtins, and when the
# probe says no, src/common/tuklib_integer.h falls through to <byteswap.h> on glibc, to
# <sys/endian.h> on the BSDs and Darwin, and to <sys/byteorder.h> on Solaris. Every one of those
# fallbacks compiles, links, and passes all nineteen tests. So a compiler with no __builtin_bswap at
# all would come back green from this project and nothing would say a word. Naming the line turns
# that silence into a did-not-build with the missing sentence on the record.
#
# The first line is the GNU C check, and it is spelled the way autoconf 2.72 spells it rather than
# the way older autoconf did. An earlier draft of this file asked for `checking whether we are using
# the GNU C compiler... yes`, which is the 2.69 wording, and gcc 16.2.0 failed the row on it. That
# is the expectation mechanism working, but it is worth writing down that a stale expectation looks
# exactly like a broken compiler until you read the log.
expect-configure = [
    "checking whether the compiler supports GNU C... yes",
    "checking if __builtin_bswap16/32/64 are supported... yes",
]
# libtool builds a shell script wrapper at src/xz/xz and puts the real executable one directory
# down. 6,266 bytes of Bourne shell is not the number this column is for.
binary = "src/xz/.libs/xz"

# automake's parallel harness, so the `# PASS:` block is printed and the automake parser reads it
# with nothing counted by hand. Nineteen tests, and they are the right nineteen for a compressor:
# test_compress.sh runs the xz that was just built over generated files and then decompresses them
# again and compares, so the oracle is a round trip rather than a recorded output, and a compressor
# miscompiled into producing a different but self consistent stream is still caught.
#
# gcc 16.2.0 on the reference machine gives 19 of 19 with 0 skipped at all six levels including lto,
# so baseline-tests is 19 and baseline-total is not set, because the reference does get a clean run
# out of this suite and there is no case it fails.
[test]
command = ["make", "check"]
oracle = "suite"
parser = "automake"
baseline-tests = 19
requires = ["sh"]

# Two hundred and forty eight files and sixty four thousand lines as the harness counts them, of
# which liblzma is eighty four C files and thirty seven thousand lines. gcc goes from tarball to
# binary in between 33 and 55 seconds, which makes this the second most expensive row on the rung
# after sqlite-shell, and the 900 that every other autoconf row carries is enough.
#
# The suite is between 31 and 39 seconds and almost all of it is real work rather than process
# setup, because each case compresses and decompresses generated files of a few megabytes. 300
# leaves room for a binary that is slow because the level could not do its job without letting a
# hang sit for the full build limit.
[limits]
build-seconds = 900
test-seconds = 300
