[project]
name = "micropython"
rung = 3
upstream = "https://github.com/micropython/micropython"
licence = "MIT"
licence-file = "LICENSE"
description = "a python implementation for microcontrollers, built here for unix, with a suite of a thousand programs"
# The dispatch loop is a computed goto, switched on for this port in the variant header rather than
# left at the default. The opcode table it jumps through is generated during the build, which is
# the other half of why this project is here: the build runs the compiler under test as a
# preprocessor over the whole source set, feeds what comes out to a python program that collects
# every interned string, and generates headers the real compile then depends on. A compiler whose
# -E output is subtly wrong does not fail to build, it builds a different program.
demands = ["computed-goto", "bit-builtins", "deep-macros"]

# The release tarball and not the tag. micropython keeps its dependencies in git submodules and the
# codeload tarball of a tag has none of them, so a build from it stops on berkeley-db, then on
# mbedtls, then on micropython-lib, and switching each one off with the make variables the port
# offers ends with a smaller program than anybody ships. The release asset is the tree with the
# submodules already in it, which is the thing upstream means when it says version 1.26.0. It is a
# hundred and ten megabytes, which is the price of that.
[source]
url = "https://github.com/micropython/micropython/releases/download/v1.26.0/micropython-1.26.0.tar.xz"
sha256 = "a1b8e0f6bf7a8a78b55ac865c46c4c45f9623a86a1785d2063ff1cb3b6e661d7"
strip-components = 1

# Recursive, which is axis A5 and the first of them on the list. The port's makefile includes three
# more, generates two headers with a python program in the middle of the build, and drives the
# compiler under test twice for two different purposes, once as a preprocessor over everything and
# once to compile.
[build]
system = "recursive"
subdir = "ports/unix"

#
# The environment is cleared as well, and that half is not about the level. Make hands a variable
# that came from the environment down to every sub make it starts, carrying whatever the parent
# appended to it, so a CFLAGS set here arrives in the mpy-cross sub build with the unix port's
# include paths and its -DMICROPY_PY_THREAD=1 on the end. mpy-cross has no mpthreadport.h, so the
# build stops on a missing header at every level. The same tree builds clean with the variable
# simply absent, which is what this asks for.
[build.level-flags]
variable = "CFLAGS_EXTRA"
why = "the port writes -Os into its own CFLAGS and appends CFLAGS_EXTRA after it, so this is the one variable that lands after the level the port chose for itself"
clears-environment = true

# The suite is a thousand python programs, each run and compared against the output recorded beside
# it, and 29748 individual assertions inside them. run-tests.py prints how many it performed and how
# many passed on two separate lines, in that order, and the parser wants the passing count first, so
# the two are put on one line with awk. That is the same shape janet and tcc use and for the same
# reason. The log keeps every original line, and the exit status is carried across by hand rather
# than lost to awk.
#
# There is a baseline-total here, which is the mechanism document 06.2 describes for a suite the
# reference compiler cannot get a clean run out of either. cmdline/repl_paste.py is why. Its case is
# driven through a pseudo terminal by run-tests.py, which writes a line and then reads whatever has
# arrived within twenty milliseconds, so on a machine that is busy the prompt for the next line
# lands in the following read and the recorded output no longer matches. GCC 16.2.0 on the reference
# machine fails it at three of the five levels and passes it at the other two, in the same run, from
# the same source. A number that moves with how loaded the machine is is not evidence about a
# compiler, and the way this file says so is to accept either outcome while still requiring that all
# 998 cases were performed and that only that one is allowed to be missing.
#
# 56 more are skipped on this port for reasons that are the port's rather than the compiler's, and
# they are outside both numbers.
[test]
command = [
    "sh",
    "-c",
    "make test > rrc-suite-output.log 2>&1; status=$?; cat rrc-suite-output.log; awk '/tests performed/ { run = $1 } /tests passed/ { passed = $1 } END { printf \"micropython: %d of %d tests passed\\n\", passed, run }' rrc-suite-output.log; exit $status",
]
oracle = "suite"
parser = "custom-regex"
regex = "micropython: (\\d+) of (\\d+) tests passed"
baseline-tests = 997
baseline-total = 998
requires = ["sh", "awk", "python3"]

# Four hundred files and a hundred and thirty six thousand lines, and python3 is needed to build it
# and not only to test it, which is unusual enough on this list to be worth saying. On the reference
# machine gcc takes between a hundred and twenty seven seconds and two hundred and one, so the
# build limit is head room for a compiler several times slower rather than a limit set for gcc.
#
# The suite is between thirty two and forty seconds and the limit is not set from that number. It
# forks the interpreter a thousand times, so what it costs is a thousand process startups and a
# thousand programs run by the binary that was just built, and a binary that is slow because the
# level could not do its work makes it slower without anything having gone wrong.
[limits]
build-seconds = 3600
test-seconds = 900
